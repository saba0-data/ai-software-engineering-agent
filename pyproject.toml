[project]
name = "ai-software-engineering-agent"
version = "0.1.0"
description = "Production-style multi-agent platform for software engineering workflows"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "langgraph>=1.0.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"